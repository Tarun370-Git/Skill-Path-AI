services:
  - type: web
    runtime: python
    name: skillpath-ai-api
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://skillpath-ai-web.onrender.com

  - type: web
    runtime: static
    name: skillpath-ai-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://skillpath-ai-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html